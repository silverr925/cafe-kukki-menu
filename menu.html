<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cafe Kukki | Dijital Menü</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #d4af37; /* Rich Gold */
            --accent-hover: #f0c956;
            --text: #f9f9f9;
            --text-muted: #a1a1aa;
            --font-sans: 'Outfit', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font-sans);
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(212, 175, 55, 0.03), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.02), transparent 25%);
            background-attachment: fixed;
        }

        /* Smooth Scrolling */
        html { scroll-behavior: smooth; }

        .header {
            padding: 60px 20px 40px;
            text-align: center;
            background: linear-gradient(to bottom, rgba(10, 10, 12, 0.9), transparent);
            position: relative;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 300;
        }

        .categories-nav {
            display: flex;
            overflow-x: auto;
            padding: 15px 20px;
            gap: 12px;
            position: sticky;
            top: 0;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            scrollbar-width: none;
            border-bottom: 1px solid var(--glass-border);
            scroll-snap-type: x mandatory;
        }
        .categories-nav::-webkit-scrollbar { display: none; }

        .cat-chip {
            padding: 10px 24px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            white-space: nowrap;
            font-size: 0.95rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            scroll-snap-align: start;
        }
        
        .cat-chip:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
        }

        .cat-chip.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            transform: scale(1.05);
        }

        .menu-container {
            padding: 30px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .category-section {
            margin-bottom: 50px;
            scroll-margin-top: 100px; /* Offset for sticky header */
        }

        .category-title {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            margin-bottom: 24px;
            padding-bottom: 12px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
        }

        .category-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 2px;
            background: var(--accent);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .menu-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .menu-item {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .menu-item:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(212, 175, 55, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .item-info { flex: 1; padding-right: 15px; }
        
        .item-name {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text);
            font-family: var(--font-serif);
            letter-spacing: 0.5px;
        }
        
        .item-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .item-price {
            font-weight: 600;
            color: var(--accent);
            font-size: 1.25rem;
            white-space: nowrap;
            background: rgba(212, 175, 55, 0.1);
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .sold-out-badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
        }

        .menu-item.sold-out {
            opacity: 0.6;
            filter: grayscale(0.5);
        }

        .footer {
            padding: 60px 20px 40px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--glass-border);
            background: linear-gradient(to top, rgba(10, 10, 12, 0.9), transparent);
        }

        .footer-logo {
            font-family: var(--font-serif);
            color: var(--accent);
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        /* Animations */
        .fade-in {
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Staggered animation delays for menu items */
        .menu-grid > div:nth-child(1) { animation-delay: 0.1s; }
        .menu-grid > div:nth-child(2) { animation-delay: 0.2s; }
        .menu-grid > div:nth-child(3) { animation-delay: 0.3s; }
        .menu-grid > div:nth-child(4) { animation-delay: 0.4s; }
        .menu-grid > div:nth-child(5) { animation-delay: 0.5s; }
        .menu-grid > div:nth-child(6) { animation-delay: 0.6s; }
    </style>
</head>
<body>

    <header class="header">
        <h1 class="logo">Cafe Kukki</h1>
        <p class="subtitle">Artisan Coffee & Italian Pizza</p>
    </header>

    <div class="categories-nav" id="cat-nav">
        <!-- Categories will be injected here -->
    </div>

    <div class="menu-container" id="menu-content">
        <!-- Menu sections will be injected here -->
    </div>

    <footer class="footer">
        <p>&copy; 2026 Cafe Kukki. Tüm hakları saklıdır.</p>
        <p style="margin-top: 10px;">Afiyet Olsun</p>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="data.js"></script>
    <script>
        function renderDigitalMenu() {
            const menu = DataStore.getMenu();
            const categoriesNav = document.getElementById('cat-nav');
            const menuContent = document.getElementById('menu-content');

            // Get unique categories
            const categories = [...new Set(menu.map(item => item.category))];
            const categoryOrder = ['Pizzalar', 'İçecekler', 'Yiyecekler', 'Tatlılar', 'Diğer'];
            
            const sortedCategories = categories.sort((a, b) => {
                const idxA = categoryOrder.indexOf(a);
                const idxB = categoryOrder.indexOf(b);
                return (idxA === -1 ? 99 : idxA) - (idxB === -1 ? 99 : idxB);
            });

            // Render Nav
            categoriesNav.innerHTML = sortedCategories.map((cat, idx) => `
                <div class="cat-chip ${idx === 0 ? 'active' : ''}" onclick="scrollToCategory('${cat}', this)">${cat}</div>
            `).join('');

            // Render Sections
            menuContent.innerHTML = sortedCategories.map(cat => {
                const items = menu.filter(i => i.category === cat);
                return `
                    <div class="category-section fade-in" id="sec-${cat}">
                        <h2 class="category-title">${cat}</h2>
                        <div class="menu-grid">
                            ${items.map(item => `
                                <div class="menu-item ${item.stock === 0 ? 'sold-out' : ''}">
                                    <div class="item-info">
                                        <div class="item-name">${item.name}</div>
                                        <div class="item-desc">
                                            ${item.stock === 0 ? '<span class="sold-out-badge">Geçici Süreyle Tükendi</span>' : 'Özenle Hazırlanır'}
                                        </div>
                                    </div>
                                    <div class="item-price">₺${item.price}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        function scrollToCategory(cat, el) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            
            const target = document.getElementById(`sec-${cat}`);
            if (target) {
                const offset = 120; // Adjusted for sticky header
                const bodyRect = document.body.getBoundingClientRect().top;
                const elementRect = target.getBoundingClientRect().top;
                const elementPosition = elementRect - bodyRect;
                const offsetPosition = elementPosition - offset;

                window.scrollTo({
                    top: offsetPosition,
                    behavior: 'smooth'
                });
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', renderDigitalMenu);

        // Firebase Sync Listener
        window.addEventListener('menuUpdated', renderDigitalMenu);
    </script>
</body>
</html>
